name: Fix Voxel version
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visible version and emergency engine loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<span>UNIVERSE 60</span><b>v60.1</b>', '<span>UNIVERSE 62</span><b>v62.0</b>')
          if './js53/boot-fix.js' not in s:
              s = s.replace('</body>', '<script type="module" src="./js53/boot-fix.js?v=62.1"></script></body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: load emergency engine bootstrap'
          git push
