name: Fix Voxel version
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set visible version to 62
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('<span>UNIVERSE 60</span><b>v60.1</b>', '<span>UNIVERSE 62</span><b>v62.0</b>')
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit version change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Set visible game version to Universe 62'
          git push
